<title>두발로 dobalro</title>
<meta name="description" content="목적지를 숨기고 방향과 거리만 안내하는 국내 소도시 발견 여행 앱">

/* ============================================================
   두발로 PWA — iOS 앱(V4.0) 테마 포팅: 오방색 + 라이트/다크
   ============================================================ */
:root{
  --serif:"Noto Serif KR","AppleMyungjo","Apple SD Gothic Neo","Nanum Myeongjo",ui-serif,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif;
  --obang-blue:#1B4DA8; --obang-red:#C8302E; --obang-white:#F0E7CD; --obang-black:#14100C;
  --danger:#A82218;
  /* dark */
  --gold:#F0C419; --gold-rgb:240,196,25;
  --canvas:#14100C; --tp:#F0E7CD; --tm:#BFA88B; --td:#9A7E5A; --tf:#7A5A42;
  --panel:#1E1813; --glass:255,255,255; --stat-label:#C49A1A; --journal-dim:#8A6E15;
  --hint-dim:#A89484;
}
:root[data-theme="light"]{
  --gold:#8A6A00; --gold-rgb:138,106,0;
  --canvas:#F5EFE3; --tp:#1A3A52; --tm:#5B6B78; --td:#7A8894; --tf:#A7AEB6;
  --panel:#FFFFFF; --glass:26,58,82; --stat-label:#8A6A00; --journal-dim:#8A6A00;
  --hint-dim:#5B6B78;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;min-height:100%;background:var(--canvas);color:var(--tp);
  font-family:var(--sans);-webkit-text-size-adjust:100%;}
body{overflow-x:hidden;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0;margin:0;}
input,textarea{font-family:inherit;}
.serif{font-family:var(--serif);}
#stars{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
#stars i{position:absolute;border-radius:50%;background:var(--gold);opacity:.15;
  animation:tw 3s ease-in-out infinite alternate;}
@keyframes tw{from{opacity:.15;transform:scale(.8);}to{opacity:.9;transform:scale(1.2);}}
body.loading #stars{display:none;}
:root[data-theme="light"] #stars{opacity:.4;}
#app{position:relative;z-index:1;min-height:100vh;min-height:100dvh;
  padding:calc(12px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
  animation:fadeIn .35s ease;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.topbar{display:flex;justify-content:space-between;align-items:center;max-width:400px;margin:0 auto;padding:0 2px 12px;}
.topbar.right{justify-content:flex-end;}
.back{font-family:var(--serif);font-size:13px;color:var(--gold);padding:6px 2px;}
.gear{font-size:16px;padding:6px 10px;border-radius:8px;background:rgba(var(--glass),.08);
  border:1px solid rgba(var(--gold-rgb),.2);line-height:1;}
.wrap{max-width:400px;margin:0 auto;}
.wrap.wide{max-width:480px;}
.vcenter{min-height:calc(100dvh - 120px);display:flex;flex-direction:column;justify-content:center;}
.card{background:rgba(var(--glass),.04);border:1px solid rgba(var(--gold-rgb),.32);border-radius:24px;
  padding:26px 22px;max-width:400px;margin:0 auto;animation:rise .8s ease both;}
@keyframes rise{from{opacity:0;transform:translateY(22px);}to{opacity:1;transform:none;}}
.card.rv{box-shadow:0 12px 40px rgba(0,0,0,.4);}
.nagune{display:inline-block;vertical-align:middle;flex-shrink:0;background:var(--gold);-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;}
.cico{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;flex-shrink:0;}
.float{display:inline-block;animation:floaty 4s ease-in-out infinite alternate;}
@keyframes floaty{from{transform:translateY(0);}to{transform:translateY(-10px);}}
.center{text-align:center;}
.obang{display:flex;gap:5px;margin:0 0 14px;}
.obang span{width:30px;height:5px;border-radius:3px;display:block;}
.en{font-size:18px;font-weight:200;letter-spacing:2px;font-style:italic;line-height:1.45;
  color:rgba(var(--gold-rgb),.8);margin:0 0 20px;}
.ko-sub{font-size:14px;color:var(--tm);line-height:1.75;margin:0 0 32px;}
.btn-go{display:block;width:100%;padding:15px;border-radius:14px;font-family:var(--serif);font-size:15px;font-weight:700;
  letter-spacing:.5px;color:#14100C;background:linear-gradient(135deg,#F0C419,#F8DA4A,#C8302E);
  box-shadow:0 0 15px rgba(var(--gold-rgb),.35);}
.btn-go.plain{background:linear-gradient(135deg,var(--gold),#C8A020);box-shadow:0 4px 14px rgba(var(--gold-rgb),.3);}
.btn-foot{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;margin-top:10px;padding:12px;
  border-radius:12px;background:rgba(var(--gold-rgb),.05);border:1px solid rgba(var(--gold-rgb),.25);
  font-family:var(--serif);font-size:13px;color:var(--gold);}
.btn-ghost{display:block;width:100%;padding:14px;border-radius:14px;border:1px solid rgba(var(--glass),.12);
  font-family:var(--serif);font-size:14px;color:var(--tm);}

.boot.sm{width:30px;height:21px;}
h1.title{font-family:var(--serif);font-size:20px;font-weight:700;margin:0;color:var(--tp);}
.subtitle{font-size:12px;color:var(--td);margin:2px 0 18px;}
.lbl{font-size:15px;font-weight:700;letter-spacing:3px;color:var(--gold);margin:0 0 9px;text-transform:uppercase;}
.field{width:100%;font-family:var(--serif);font-size:14px;padding:12px 14px;border-radius:12px;color:var(--tp);
  background:rgba(var(--glass),.06);border:1px solid rgba(var(--glass),.1);outline:none;}
.field.hl{border-color:rgba(var(--gold-rgb),.4);}
.field::placeholder{color:var(--tf);}
.gpsbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:8px;padding:11px;border-radius:12px;
  font-family:var(--serif);font-size:13px;background:rgba(var(--gold-rgb),.08);border:1px solid rgba(var(--gold-rgb),.3);color:var(--gold);}
.gpsbtn.ok{background:rgba(45,122,79,.08);border-color:rgba(45,122,79,.35);color:#2D7A4F;}
.err{font-size:12px;color:#E0584B;margin-top:6px;line-height:1.5;}
:root[data-theme="light"] .err{color:var(--danger);}
.sp{height:22px;}
.note{font-size:11px;margin-top:6px;}
.budget-row{display:flex;align-items:center;}
.budget-row .cur{font-size:17px;color:var(--tf);margin-left:-34px;padding-right:14px;pointer-events:none;}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;}
.chips::-webkit-scrollbar{display:none;}
.chip{flex-shrink:0;font-family:var(--serif);font-size:12px;padding:9px 13px;border-radius:999px;
  background:rgba(var(--glass),.04);border:1px solid rgba(var(--glass),.08);color:var(--tf);}
.chip.on{background:rgba(var(--gold-rgb),.18);border-color:var(--gold);color:var(--gold);}
.tgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.tbtn{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 2px;border-radius:12px;font-size:10px;
  background:rgba(var(--glass),.03);border:1px solid rgba(var(--glass),.07);color:var(--td);}
.tbtn.on{background:rgba(var(--gold-rgb),.12);border-color:var(--gold);color:var(--gold);}
.tbtn svg{width:24px;height:24px;}
.gsz{display:flex;gap:8px;}
.gsz button{flex:1;height:44px;border-radius:10px;font-family:var(--serif);font-size:14px;
  background:rgba(var(--glass),.04);border:1px solid rgba(var(--glass),.08);color:var(--tf);}
.gsz button.on{background:rgba(var(--gold-rgb),.18);border-color:var(--gold);color:var(--gold);font-weight:700;}
.gsz button.five{font-size:12px;}
/* Today panel */
.today{border-radius:14px;background:rgba(var(--gold-rgb),.08);border:1px solid rgba(var(--gold-rgb),.32);padding:16px 18px;}
.today .ttl{font-size:10px;font-weight:600;letter-spacing:3px;color:var(--gold);text-align:center;margin-bottom:12px;text-transform:uppercase;}
.today .r1{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.today .date{font-family:var(--serif);font-size:36px;font-weight:900;color:var(--tp);}
.today .wd{font-size:13px;font-weight:600;color:var(--td);margin-left:8px;}
.today .wx{display:flex;align-items:center;gap:6px;}
.today .wx .em{font-size:32px;}
.today .wx .tmp{font-size:22px;font-weight:900;text-align:right;}
.today .wx .lb{font-size:10px;color:var(--td);text-align:right;}
.today .wx.none{font-size:11px;color:var(--tf);text-align:right;line-height:1.5;}
.today .wx.none .em{font-size:28px;opacity:.55;}
.today .term{font-size:13px;font-weight:600;color:#7AB87A;text-align:center;}
:root[data-theme="light"] .today .term{color:#3E7A3E;}
.today .sug{font-size:11px;color:var(--td);text-align:center;margin-top:6px;}
.today hr{border:none;border-top:1px dashed rgba(var(--gold-rgb),.3);margin:12px 0;}
.today .q{font-family:var(--serif);font-style:italic;font-size:13px;line-height:1.7;text-align:center;color:var(--tp);}
.today .qw{font-size:11px;color:var(--gold);text-align:center;margin-top:6px;}
/* Reveal */
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:2px;padding:5px 14px;border-radius:999px;}
.clue{font-family:var(--serif);font-size:19px;font-weight:700;line-height:1.75;margin:14px 0 6px;color:var(--tp);}
.mood{font-family:var(--serif);font-style:italic;font-size:12px;color:var(--tm);}
.info2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:22px 0 12px;}
.ibox{border-radius:14px;padding:14px;text-align:center;}
.ibox .k{font-size:10px;font-weight:600;letter-spacing:2px;color:var(--td);margin-bottom:4px;}
.ibox .big{font-family:var(--serif);font-size:30px;font-weight:700;color:var(--gold);}
.ibox .big small{font-size:13px;font-weight:400;}
.costrow{display:flex;align-items:baseline;gap:6px;padding:14px;border-radius:14px;margin-bottom:12px;
  background:rgba(var(--gold-rgb),.05);border:1px solid rgba(var(--gold-rgb),.15);}
.costrow .a{font-size:12px;color:var(--td);flex:1;}
.costrow .b{font-size:14px;font-weight:700;color:var(--gold);}
.costrow .c{font-size:11px;color:var(--td);}
.secret{padding:14px;border-radius:14px;margin-bottom:14px;background:rgba(var(--glass),.03);border:1px dashed rgba(var(--glass),.14);}
.secret .k{font-size:10px;font-weight:600;letter-spacing:2px;color:var(--td);margin-bottom:6px;}
.secret p{margin:0;font-family:var(--serif);font-style:italic;font-size:13px;line-height:1.9;color:var(--tm);}
.guide{display:flex;gap:10px;align-items:center;padding:14px;border-radius:14px;margin-bottom:20px;
  background:rgba(27,77,168,.07);border:1px solid rgba(27,77,168,.2);font-size:12px;line-height:1.7;color:rgba(80,130,220,.95);white-space:pre-line;}
:root[data-theme="light"] .guide{color:#1B4DA8;}
.guide .g{font-size:22px;}
/* Navigate */
.guiding{font-size:10px;font-weight:600;letter-spacing:3px;text-align:center;margin-bottom:16px;text-transform:uppercase;}
.navrow{display:flex;align-items:center;gap:14px;margin-bottom:18px;}
.hud{flex:1;padding:16px 10px;border-radius:18px;text-align:center;background:rgba(var(--glass),.05);}
.hud.pulse{animation:pulse .7s ease;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(var(--gold-rgb),.6);}100%{box-shadow:0 0 0 22px rgba(var(--gold-rgb),0);}}
.hud .k{font-size:10px;font-weight:600;letter-spacing:2px;color:var(--td);text-transform:uppercase;margin-bottom:6px;}
.hud .arrow{font-size:58px;font-weight:700;line-height:1.1;transition:all .25s;}
.hud .dist{font-family:var(--serif);font-size:24px;font-weight:700;margin-top:6px;}
.hud .word{font-size:12px;color:var(--tm);margin-top:4px;}
.hud .meas{font-family:var(--serif);font-size:20px;font-weight:700;color:var(--gold);margin-top:8px;}
.compass{width:156px;height:156px;flex-shrink:0;}
.compass svg{width:156px;height:156px;display:block;}
#needle{transform-origin:130px 130px;transition:transform .18s linear;}
.mapbtn{display:block;width:100%;padding:13px;border-radius:14px;font-family:var(--serif);font-size:14px;font-weight:700;color:#fff;margin-bottom:12px;}
.gpswarn{padding:14px;border-radius:14px;margin-bottom:12px;font-size:12px;color:#E8825A;
  background:rgba(232,130,90,.08);border:1px solid rgba(232,130,90,.2);}
.quests{padding:14px;border-radius:14px;margin-bottom:14px;background:rgba(var(--gold-rgb),.05);border:1px solid rgba(var(--gold-rgb),.18);}
.quests .qh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.quests .qh b{font-size:10px;font-weight:600;letter-spacing:2px;color:var(--gold);text-transform:uppercase;}
.quests .qh span{font-size:11px;color:var(--td);}
.q-row{display:flex;align-items:center;gap:10px;padding:6px 0;}
.q-row+.q-row{border-top:1px solid rgba(var(--gold-rgb),.15);}
.q-row .ic{font-size:22px;}
.q-row .tx{flex:1;font-size:12px;line-height:1.6;color:var(--tf);}
.q-row.done{opacity:.7;}
.q-row.done .tx{color:var(--tm);text-decoration:line-through;}
.q-row img{width:42px;height:42px;border-radius:8px;object-fit:cover;}
.q-cam{width:42px;height:42px;border-radius:8px;font-size:16px;}
.hintline{font-family:var(--serif);font-style:italic;font-size:12px;line-height:1.8;color:var(--hint-dim);margin-bottom:14px;}
.movingby{display:flex;align-items:center;gap:8px;margin-bottom:18px;font-size:12px;color:var(--hint-dim);}
.movingby svg{width:18px;height:18px;color:var(--tm);}
.btnrow{display:flex;gap:8px;}
.btnrow button{flex:1;padding:12px;border-radius:14px;font-family:var(--serif);font-size:13px;}
.btnrow .back-b{border:1px solid rgba(var(--glass),.12);color:var(--tm);}
/* Overlays / sheets */
#overlay,#modal{position:fixed;inset:0;display:none;overflow-y:auto;background:var(--canvas);-webkit-overflow-scrolling:touch;}
#overlay{z-index:50;}
#modal{z-index:60;}
#overlay.on,#modal.on{display:block;}
.ov-in{min-height:100%;display:flex;align-items:center;justify-content:center;
  padding:calc(24px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));position:relative;z-index:1;}
.ov-card{width:100%;max-width:360px;background:var(--panel);border-radius:22px;padding:20px;
  display:flex;flex-direction:column;gap:12px;align-items:stretch;box-shadow:0 0 30px rgba(0,0,0,.5);}
.ov-card.center{align-items:center;text-align:center;}
.photo-slot{width:140px;height:140px;border-radius:14px;margin:0 auto;object-fit:cover;}
.photo-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  width:140px;height:140px;margin:0 auto;border-radius:14px;font-family:var(--serif);font-size:13px;}
.jf{text-align:left;}
.jf label{display:block;font-size:10px;font-weight:600;letter-spacing:1.5px;color:var(--gold);margin-bottom:3px;}
.jf textarea{width:100%;resize:none;font-family:var(--serif);font-size:13px;padding:8px;border-radius:8px;
  border:1px solid rgba(0,0,0,.1);background:#fff;color:#000;outline:none;}
.statbar{display:flex;align-items:center;padding:12px;border-radius:14px;background:rgba(var(--gold-rgb),.06);border:1px solid rgba(var(--gold-rgb),.2);}
.statbar>div{flex:1;text-align:center;}
.statbar .sep{flex:0 0 1px;height:30px;background:rgba(var(--gold-rgb),.2);}
.statbar .k{font-size:10px;letter-spacing:1.5px;color:var(--td);margin-bottom:3px;}
.statbar .v{font-family:var(--serif);font-size:22px;font-weight:700;color:var(--gold);}
.statbar .v small{font-size:12px;font-weight:400;}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid rgba(var(--gold-rgb),.2);border-top-color:var(--gold);
  animation:spin 1s linear infinite;margin:0 auto;}
@keyframes spin{to{transform:rotate(360deg);}}
#sheet{position:fixed;inset:0;z-index:70;display:none;background:rgba(0,0,0,.45);align-items:flex-end;justify-content:center;}
#sheet.on{display:flex;}
.sheet-box{width:100%;max-width:480px;padding:12px 12px calc(12px + env(safe-area-inset-bottom));animation:up .25s ease;}
@keyframes up{from{transform:translateY(40px);opacity:0;}to{transform:none;opacity:1;}}
.sheet-grp{background:var(--panel);border-radius:14px;overflow:hidden;margin-bottom:8px;}
.sheet-t{padding:12px 16px 8px;text-align:center;font-size:13px;color:var(--td);line-height:1.5;}
.sheet-b{display:block;width:100%;padding:16px;font-size:17px;color:var(--gold);border-top:1px solid rgba(var(--glass),.1);}
.sheet-b.destructive{color:#E0584B;}
.sheet-b.cancel{font-weight:700;margin:0;}
/* Loading */
#loading{position:fixed;inset:0;z-index:5;overflow:hidden;}
#loading svg.bg{position:absolute;inset:0;width:100%;height:100%;}
#loading .shade{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 50%,rgba(0,0,0,.55));}
#loading .ct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:0 16px;}
.scene{position:relative;width:280px;height:200px;overflow:hidden;}
#walker{position:absolute;top:50%;width:140px;height:140px;margin:-70px 0 0 -70px;transition:left .12s linear;}
#walker img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4));
  transform-origin:bottom center;animation:step .96s ease-in-out infinite;}
@keyframes step{0%,100%{transform:translateY(0) rotate(1.5deg) scaleY(.96);}50%{transform:translateY(-5px) rotate(-1.5deg) scaleY(1);}}
.lmsg{font-family:var(--serif);font-size:16px;font-weight:600;color:#FCEFE3;text-shadow:0 1px 4px rgba(0,0,0,.6);min-height:28px;text-align:center;animation:fadeIn .5s ease;}
.lsub{font-size:12px;color:rgba(247,228,210,.9);text-shadow:0 1px 3px rgba(0,0,0,.5);text-align:center;}
.lsecret{font-family:var(--serif);font-size:11px;color:rgba(247,228,210,.8);text-shadow:0 1px 3px rgba(0,0,0,.5);text-align:center;}
#loading .gear{position:absolute;right:16px;top:calc(12px + env(safe-area-inset-top));z-index:2;}
.tw2{animation:tw 2.6s ease-in-out infinite alternate;}
.mist1{animation:drift 12s ease-in-out infinite alternate;}
.mist2{animation:drift2 12s ease-in-out infinite alternate;}
@keyframes drift{from{transform:translateX(0);}to{transform:translateX(24px);}}
@keyframes drift2{from{transform:translateX(0);}to{transform:translateX(-19px);}}
.sunp{animation:sunp 3.2s ease-in-out infinite alternate;transform-origin:304px 208px;}
@keyframes sunp{from{transform:scale(1);opacity:.85;}to{transform:scale(1.12);opacity:1;}}
.rip{animation:rip 2.2s ease-in-out infinite alternate;}
@keyframes rip{from{transform:translateX(-6px);opacity:.3;}to{transform:translateX(6px);opacity:.7;}}
/* History */
.hhead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;}
.hhead h2{font-family:var(--serif);font-size:22px;font-weight:700;margin:0;display:flex;align-items:center;gap:6px;}
.hhead .s{font-size:11px;color:var(--td);margin-top:2px;}
.tabs{display:flex;gap:4px;}
.tabs button{font-size:13px;padding:6px 10px;border-radius:10px;background:rgba(var(--glass),.04);color:var(--tf);}
.tabs button.on{background:rgba(var(--gold-rgb),.2);color:var(--gold);}
.stats2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.sbox{text-align:center;padding:14px 0;border-radius:14px;background:rgba(var(--gold-rgb),.07);border:1px solid rgba(var(--gold-rgb),.32);}
.sbox .k{font-size:10px;letter-spacing:2px;color:var(--stat-label);margin-bottom:4px;}
.sbox .v{font-family:var(--serif);font-size:32px;font-weight:700;color:var(--gold);}
.sbox .v small{font-size:14px;font-weight:400;}
.tstat{margin-bottom:14px;}
.tstat .k{font-size:10px;font-weight:600;letter-spacing:2px;color:var(--stat-label);margin-bottom:8px;}
.tstat .row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;}
.tstat .it{min-width:60px;padding:8px 6px;border-radius:10px;text-align:center;background:rgba(var(--gold-rgb),.06);border:1px solid rgba(var(--gold-rgb),.2);}
.tstat .it svg{width:18px;height:18px;color:var(--tm);}
.tstat .it .n{font-size:9px;color:var(--td);}
.tstat .it .d{font-family:var(--serif);font-size:13px;font-weight:700;color:var(--gold);}
.tstat .it .d small{font-size:9px;font-weight:400;color:var(--tf);}
.cchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
.cchip{font-size:11px;padding:3px 9px;border-radius:999px;}
.cstat{margin-bottom:14px;padding:16px 14px 8px;border-radius:14px;background:rgba(var(--gold-rgb),.05);border:1px solid rgba(var(--gold-rgb),.2);}
.cstat .k{font-size:11px;font-weight:600;letter-spacing:2px;color:var(--stat-label);margin-bottom:14px;}
.cbar{display:grid;grid-template-columns:28px 84px 1fr 62px;align-items:center;gap:10px;margin-bottom:14px;}
.cbar .cn{font-size:14px;color:var(--tm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cbar .ct{height:18px;border-radius:9px;background:rgba(var(--gold-rgb),.10);overflow:hidden;}
.cbar .cf{height:100%;border-radius:9px;}
.cbar .cv{font-family:var(--serif);font-size:18px;font-weight:700;color:var(--gold);text-align:right;white-space:nowrap;line-height:1.1;}
.cbar .cv small{font-size:11px;font-weight:400;color:var(--tf);margin-left:1px;}
.cbar .cv .cp{display:block;font-family:inherit;font-size:10px;font-weight:400;color:var(--td);}
.cbar.z{opacity:.4;}
.fchips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
.fchip{aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font:inherit;padding:6px;border-radius:14px;cursor:pointer;color:var(--c);background:rgba(var(--gold-rgb),.04);border:1.5px solid var(--c);}
.fchip .fn{font-size:12px;font-weight:600;line-height:1.2;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
.fchip b{font-family:var(--serif);font-size:18px;font-weight:700;line-height:1;}
.fchip .fall{width:34px;height:34px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;font-size:18px;background:var(--c);color:#fff;}
.fchip.on{background:var(--c);color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.25);}
.fchip.on .cico,.fchip.on .fall{background:rgba(255,255,255,.22)!important;}
.fchip.z{opacity:.35;cursor:default;}
.fchip.all{grid-column:1/-1;aspect-ratio:auto;flex-direction:row;justify-content:center;gap:10px;padding:12px 14px;}
.fchip.all .fall{width:28px;height:28px;font-size:15px;border-radius:8px;}
.fchip.all .fn{font-size:14px;}
.fchip.all b{font-size:20px;}
.fhead{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--tm);margin:2px 2px 10px;}
.stampgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 8px;}
.stampcell{text-align:center;position:relative;cursor:pointer;}
.stampcell .st{position:relative;width:100px;height:100px;margin:0 auto;}
.stampcell .st svg{width:94px;height:94px;}
.stampcell .x{position:absolute;right:-2px;top:-4px;width:18px;height:18px;border-radius:50%;font-size:12px;font-weight:700;line-height:17px;
  color:var(--danger);background:rgba(30,20,20,.9);border:1px solid rgba(255,255,255,.1);}
.stampcell .nm{font-size:9px;color:var(--tf);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.stampcell .jn{font-size:8px;font-style:italic;color:var(--journal-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lcard{border-radius:14px;margin-bottom:12px;background:rgba(var(--glass),.03);overflow:hidden;cursor:pointer;}
.lcard .t{display:flex;gap:12px;align-items:center;padding:12px 12px 8px;}
.lcard .th{width:58px;height:58px;border-radius:8px;object-fit:cover;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:24px;}
.lcard .mt{flex:1;min-width:0;}
.lcard .mt b{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lcard .mt .c{font-size:11px;margin-top:2px;}
.lcard .mt .d{font-size:10px;color:var(--tf);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lcard .del{font-size:18px;color:var(--tf);padding:6px;}
.lcard .jr{padding:8px 12px 12px;border-top:1px dashed rgba(var(--gold-rgb),.15);margin:0 12px 0;padding-left:0;padding-right:0;}
.lcard .jr .k{font-size:10px;letter-spacing:2px;color:var(--journal-dim);margin-bottom:5px;}
.lcard .jr p{margin:0 0 4px;font-family:var(--serif);font-style:italic;font-size:12px;line-height:2;color:var(--tm);}
.delall{display:block;width:100%;margin-top:18px;padding:10px;border-radius:10px;font-family:var(--serif);font-size:11px;
  color:rgba(168,34,24,.7);border:1px solid rgba(168,34,24,.2);}
.empty{text-align:center;padding:40px 0;}
.empty .a{font-family:var(--serif);font-size:13px;color:var(--tf);}
.empty .b{font-size:11px;opacity:.6;margin-top:8px;}
#hmap,.rmap{border-radius:14px;overflow:hidden;background:rgba(var(--glass),.05);}
#hmap{height:420px;}
.rmap{height:200px;}
.pin{width:24px;height:24px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 4px rgba(0,0,0,.4);}
.dotg{width:14px;height:14px;border-radius:50%;background:#2E9E5B;border:2px solid #fff;box-shadow:0 0 2px rgba(0,0,0,.3);}
.dotr{width:16px;height:16px;border-radius:50%;background:#C8302E;border:2px solid #fff;box-shadow:0 0 3px rgba(0,0,0,.4);}
/* Detail / settings */
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.mhead h3{margin:0;font-family:var(--serif);font-size:18px;font-weight:700;display:flex;gap:6px;align-items:center;}
.mdone{font-family:var(--serif);font-size:14px;font-weight:700;color:var(--gold);padding:6px 0 6px 12px;}
.mwrap{max-width:480px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px;position:relative;z-index:1;}
.scard{padding:16px;border-radius:12px;background:rgba(var(--glass),.05);border:1px solid rgba(var(--gold-rgb),.18);box-shadow:0 3px 8px rgba(0,0,0,.1);}
.scard .sh{display:flex;align-items:center;gap:6px;font-family:var(--serif);font-size:14px;font-weight:600;color:var(--gold);margin-bottom:12px;}
.srow{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.srow .k{font-size:16px;}
.srow .sub{font-size:13px;color:var(--td);margin-top:2px;}
.seg{display:flex;background:rgba(var(--glass),.08);border-radius:9px;padding:2px;margin-top:8px;}
.seg button{flex:1;padding:7px 4px;border-radius:7px;font-size:13px;color:var(--tm);}
.seg button.on{background:var(--panel);color:var(--gold);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.2);}
.sdiv{height:1px;background:rgba(var(--gold-rgb),.12);margin:14px 0;}
select.sel{font-size:15px;padding:7px 10px;border-radius:8px;background:rgba(var(--glass),.08);color:var(--gold);border:1px solid rgba(var(--gold-rgb),.25);}
.tog{width:51px;height:31px;border-radius:999px;background:rgba(var(--glass),.2);position:relative;flex-shrink:0;transition:background .2s;}
.tog::after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3);}
.tog.on{background:var(--gold);}
.tog.on::after{transform:translateX(20px);}
.dphoto{width:100%;height:220px;object-fit:cover;border-radius:16px;}
.dph0{height:160px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:56px;}
.dtitle{text-align:center;}
.dtitle .c{font-size:12px;font-weight:600;}
.dtitle h4{font-family:var(--serif);font-size:22px;font-weight:700;margin:6px 0;}
.dtitle .m{font-size:12px;color:var(--td);}
.dinfo{display:flex;padding:14px 0;border-radius:14px;background:rgba(var(--glass),.05);border:1px solid rgba(var(--gold-rgb),.18);}
.dinfo>div{flex:1;text-align:center;padding:0 4px;}
.dinfo>div+div{border-left:1px solid rgba(var(--gold-rgb),.15);}
.dinfo .k{font-size:10px;font-weight:600;letter-spacing:1px;color:var(--td);margin-bottom:4px;}
.dinfo .v{font-family:var(--serif);font-size:15px;font-weight:700;}
.dsec{padding:14px;border-radius:14px;background:rgba(var(--glass),.04);}
.dsec .k{font-size:11px;font-weight:600;letter-spacing:2px;color:var(--gold);margin-bottom:8px;text-transform:uppercase;}
.dsec p{margin:0;font-family:var(--serif);font-size:13px;line-height:1.9;color:var(--tm);white-space:pre-line;}
.dsec p.j{color:var(--tp);line-height:2;}
.legend{display:flex;gap:16px;margin-top:8px;font-size:11px;color:var(--tm);}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;}
/* Install + login */
.install-card{background:rgba(var(--gold-rgb),.1);border:1px solid rgba(var(--gold-rgb),.35);border-radius:14px;padding:16px 18px;margin:14px auto 0;max-width:400px;}
.install-card h4{margin:0 0 6px;font-size:14px;color:var(--gold);}
.install-card p{margin:0 0 10px;font-size:13px;color:var(--td);line-height:1.6;}
.install-steps{margin:0;padding-left:18px;font-size:13px;line-height:1.8;}
.install-steps b{color:var(--gold);}
.install-card .btn-go{margin-top:4px;}
.login-card{max-width:400px;margin:14px auto 0;padding:16px 18px;border-radius:14px;background:rgba(var(--glass),.04);border:1px solid rgba(var(--gold-rgb),.2);}
.login-card .k{font-size:13px;font-weight:600;color:var(--tp);margin-bottom:10px;}
.login-card .em{font-size:12px;color:var(--td);margin-bottom:10px;}
.lbtn{display:block;width:100%;padding:12px;border-radius:8px;font-size:15px;font-weight:600;margin-bottom:8px;}
.lbtn.kakao{background:#FEE500;color:#1a1400;}
.lbtn.google{background:#fff;color:#222;}
.linp{display:block;width:100%;box-sizing:border-box;padding:12px;margin-bottom:8px;border-radius:8px;border:1px solid rgba(var(--gold-rgb),.3);background:rgba(var(--glass),.06);color:var(--tp);font-size:16px;outline:none;}
.linp:focus{border-color:var(--gold);}
.lrow{display:flex;gap:8px;}.lrow .lbtn{margin-bottom:8px;}
.lbtn.pri{background:var(--gold);color:#14100C;}
.lbtn.sec{background:rgba(var(--glass),.08);color:var(--tp);border:1px solid rgba(var(--gold-rgb),.3);}
.lmsg{min-height:16px;font-size:12px;color:#e0705a;margin-bottom:8px;}.lmsg.ok{color:var(--td);}
.lbtn.out{background:rgba(var(--glass),.08);color:var(--tm);margin-bottom:0;}
.resume{max-width:400px;margin:14px auto 0;padding:14px 18px;border-radius:14px;background:rgba(var(--gold-rgb),.1);border:1px solid var(--gold);}
.resume p{margin:0 0 10px;font-size:13px;color:var(--tp);line-height:1.6;}
.screen{animation:fadeIn .35s ease;}
.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:80;
  background:#222;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;max-width:86vw;text-align:center;}
.toast.show{opacity:1;}
.leaflet-container{font-family:var(--sans);}
</style>
</head>

<div id="app"></div>

function pickThree(cat) {
  const sh = (a) => { const b = [...a]; for (let i = b.length - 1; i > 0; i--) { const k = Math.floor(Math.random() * (i + 1)); [b[i], b[k]] = [b[k], b[i]]; } return b; };
  const catQ = sh(QUEST_POOL.filter((q) => q.cat && q.cat === cat)).slice(0, 1);
  const used = new Set(), common = [];
  for (const q of sh(QUEST_POOL.filter((q) => !q.cat))) {
    if (used.has(q.theme)) continue;
    used.add(q.theme); common.push(q);
    if (catQ.length + common.length >= 3) break;
  }
  return [...catQ, ...common].map((q) => ({ ...q, photo: null }));
}

function distanceM(a, b) {
  const R = 6371000, r = Math.PI / 180;
  const dLat = (b.lat - a.lat) * r, dLng = (b.lng - a.lng) * r;
  const s = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLng / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(s), Math.sqrt(1 - s));
}
function bearingDeg(a, b) {
  const r = Math.PI / 180, l1 = a.lat * r, l2 = b.lat * r, dL = (b.lng - a.lng) * r;
  const y = Math.sin(dL) * Math.cos(l2);
  const x = Math.cos(l1) * Math.sin(l2) - Math.sin(l1) * Math.cos(l2) * Math.cos(dL);
  return ((Math.atan2(y, x) / r) + 360) % 360;
}
const ARROWS = ["↑", "↗", "→", "↘", "↓", "↙", "←", "↖"];
function arrowFromBearing(bearing, heading) {
  const rel = ((bearing - (heading ?? 0)) % 360 + 360) % 360;
  const idx = Math.floor((rel + 22.5) / 45) % 8;
  return ARROWS[idx];
}
const DIRS = ["dir_n", "dir_ne", "dir_e", "dir_se", "dir_s", "dir_sw", "dir_w", "dir_nw"];
const cardinalLabel = (deg) => t(DIRS[Math.round(deg / 45) % 8]);

}

function pickDestination(pool, origin, transportKey, timeKey, budget, mult = 1, visited = null) {
  const tr = TRANSPORT[transportKey];
  const minutes = TIME_RANGE[timeKey];
  const capped = transportKey === "walk" ? Math.min(minutes, 60) : minutes;
  const baseMaxKm = tr.kmh * capped / 60;
  const maxKm = baseMaxKm * mult, minKm = Math.max(0.2, baseMaxKm * 0.05);
  const cands = [];
  for (const p of pool) {
    const km = distanceM(origin, p) / 1000;
    if (km < minKm || km > maxKm) continue;
    if (budget != null && p.cost > budget) continue;
    if (visited && visited.has(p.name)) continue; // 이미 다녀온 장소 제외
    cands.push({ p, km });
  }
  if (!cands.length) return null;
  const { p, km } = cands[Math.floor(Math.random() * cands.length)];
  return {
    dest: p, category: p.category, distanceKm: km,
    travelTimeMin: Math.max(5, Math.round(km / tr.kmh * 60)),
    estimatedCost: p.cost || 0, clue: p.clue, mood: p.mood, hint: p.hint,
  };
}

const HKEY = "dobalro_history_v2", HKEY_OLD = "dobalro_history_v1", MAX_HISTORY = 100;
function readHistory() {
  try {
    const raw = localStorage.getItem(HKEY);
    if (raw) return JSON.parse(raw);
    const old = localStorage.getItem(HKEY_OLD);
    if (old) {
      const list = JSON.parse(old).map((e, i, a) => ({
        id: Date.parse(e.visited_at || 0) || Date.now() - i, date: e.visited_at || new Date().toISOString(),
        placeName: e.place_name, category: e.category, photo: null, distanceKm: e.distance_km || 0,
        transport: e.transport || "walk", estimatedCost: e.estimated_cost || 0, isMarket: !!e.is_market,
        clue: e.cryptic_clue || "", originLat: e.origin_lat ?? null, originLng: e.origin_lng ?? null,
        destLat: null, destLng: null, journal: "", visitCount: a.length - i,
      }));
      localStorage.setItem(HKEY, JSON.stringify(list));
      return list;
    }
  } catch (e) {}
  return [];
}
function writeHistory(list) {
  for (let drop = 0; drop <= list.length; drop++) {
    try {
      const copy = list.map((e, i) => (i >= list.length - drop ? { ...e, photo: null } : e));
      localStorage.setItem(HKEY, JSON.stringify(copy));
      if (drop > 0) toast(t("save_fail"));
      return;
    } catch (e) {}
  }
}

function getOnce() {
  const once = (opts) => new Promise((res, rej) => {
    navigator.geolocation.getCurrentPosition(
      (p) => res({ lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy }), rej, opts);
  });
  if (!("geolocation" in navigator)) return Promise.reject(new Error("unsupported"));
  // 1차: 고정밀(GPS) → 시간 초과·측위 불가면 2차: 저정밀(Wi-Fi/기지국)로 재시도. 권한 거부(code 1)만 바로 실패.
  return once({ enableHighAccuracy: true, timeout: 10000, maximumAge: 5000 }).catch((e) => {
    if (e && e.code === 1) throw e;
    return once({ enableHighAccuracy: false, timeout: 15000, maximumAge: 60000 });
  });
}
async function reverseGeocode(c) {
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${c.lat}&lon=${c.lng}&zoom=16&accept-language=ko`);
    const a = (await r.json()).address || {};
    const raw = [a.suburb || a.quarter || a.neighbourhood || a.village, a.city_district || a.city || a.county || a.town, a.state];
    const parts = [];
    for (const s of raw) if (s && !parts.includes(s)) parts.push(s);
    if (parts.length >= 2) return `${parts[1]} ${parts[0]}`;
    return parts[0] || null;
  } catch (e) { return null; }
}
async function geocode(text) {
  const q = (text || "").trim();
  if (!q) return null;
  for (const query of [q, q + " 대한민국"]) {
    try {
      const r = await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=kr&accept-language=ko&q=${encodeURIComponent(query)}`);
      const j = await r.json();
      if (j && j[0]) return { lat: +j[0].lat, lng: +j[0].lon };
    } catch (e) {}
  }
  return null;
}

let orientBound = false;
function bindOrientation() {
  if (orientBound) return;
  orientBound = true;
  window.addEventListener("deviceorientationabsolute", onOrient, true);
  window.addEventListener("deviceorientation", onOrient, true);
}
function requestCompass() {
  if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
    DeviceOrientationEvent.requestPermission().then((r) => { if (r === "granted") bindOrientation(); else toast(t("compass_off")); }).catch(() => {});
  } else bindOrientation();
}
function onOrient(e) {
  let h = null;
  if (e.webkitCompassHeading != null && !isNaN(e.webkitCompassHeading)) h = e.webkitCompassHeading;
  else if ((e.absolute || e.type === "deviceorientationabsolute") && e.alpha != null) h = (360 - e.alpha) % 360;
  if (h == null) return;
  if (S.heading == null) S.heading = h;
  else { const d = ((h - S.heading + 540) % 360) - 180; S.heading = (S.heading + d * 0.35 + 360) % 360; }
  scheduleNav();
}
let navRaf = 0;
function scheduleNav() { if (S.screen !== "navigate" || navRaf) return; navRaf = requestAnimationFrame(() => { navRaf = 0; updateNav(); }); }

let wakeLock = null;
async function acquireWake() { try { if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {} }
function releaseWake() { try { wakeLock && wakeLock.release(); } catch (e) {} wakeLock = null; }

function startTracking() {
  if (!("geolocation" in navigator)) { toast(t("err_geo_unsupported")); return; }
  if (S.watchId != null) return;
  S.watchId = navigator.geolocation.watchPosition(onPos, (e) => { if (e && e.code === 1) toast(t("err_geo_denied")); },
    { enableHighAccuracy: true, maximumAge: 2000, timeout: 20000 });

}

}

let actx = null;
function unlockAudio() {
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === "suspended") actx.resume(); } catch (e) {}
}
function beep(freq, at, dur, vol) {
  if (!actx) return;
  try {
    const o = actx.createOscillator(), g = actx.createGain(), t0 = actx.currentTime + at;
    o.type = "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0 + dur + 0.05);
  } catch (e) {}
}
function proximityFeedback(zone) {
  if (!settings.prox) return;
  const hud = $("hud"); if (hud) { hud.classList.remove("pulse"); void hud.offsetWidth; hud.classList.add("pulse"); }
  if (zone === 1) { beep(660, 0, 0.14, 0.12); try { navigator.vibrate && navigator.vibrate(30); } catch (e) {} }
  else if (zone === 2) { beep(880, 0, 0.12, 0.16); beep(880, 0.2, 0.12, 0.16); try { navigator.vibrate && navigator.vibrate([40, 60, 40]); } catch (e) {} }
  else if (zone === 3) { [0, 0.2, 0.4].forEach((a) => beep(1040, a, 0.12, 0.2)); try { navigator.vibrate && navigator.vibrate([80, 60, 80, 60, 80]); } catch (e) {} }
}
const zoneOf = (d) => (d < 5 ? 3 : d < 15 ? 2 : d < 50 ? 1 : 0);
function evaluateArrival() {
  if (!S.result || !S.cur) return;
  const d = distanceM(S.cur, S.result.dest);
  const z = zoneOf(d);
  if (z > S.lastZone && z > 0) proximityFeedback(z);
  S.lastZone = z;
  if (!S.revealed && d <= 200) { S.revealed = true; renderArrival(); }
}

function setProgress(p) {
  S.progress = p; const w = $("walker"); if (w) w.style.left = 70 + p * 120 + "px";
}
let loadTimer = null;
function startLoadMsgs() {
  stopLoadMsgs(); let i = 0;
  loadTimer = setInterval(() => {
    if (S.screen !== "loading") return stopLoadMsgs();
    i = (i + 1) % 5; const el = $("lmsg"); if (el) { el.style.animation = "none"; void el.offsetWidth; el.style.animation = ""; el.textContent = t("loading_" + (i + 1)); }
  }, 1800);
}
function stopLoadMsgs() { clearInterval(loadTimer); loadTimer = null; }

async function handleStart() {
  S.budget = parseBudget(); S.setupError = "";
  S.progress = 0; go("loading");
  let origin = S.gps;
  if (!origin && !(S.locationText || "").trim()) { try { origin = await getOnce(); S.gps = origin; } catch (e) {} }
  if (!origin) origin = await geocode(S.locationText);
  if (!origin) { S.setupError = t("err_no_origin"); go("setup"); return; }
  S.tripOrigin = { lat: origin.lat, lng: origin.lng };
  setProgress(0.2);
  const poolP2 = loadPool();
  for (let i = 1; i <= 36; i++) {
    await sleep(100);
    if (S.screen !== "loading") return;
    setProgress(0.2 + 0.7 * (i / 36));
  }
  const pool = await poolP2;
  if (!pool) { S.setupError = t("err_no_pool"); go("setup"); return; }
  let picked = null;
  const visited = new Set(HIST.map((e) => e.placeName));
  for (const m of [1, 2, 4]) { picked = pickDestination(pool, S.tripOrigin, S.transport, S.timeRange, S.budget, m, visited); if (picked) break; }
  if (!picked && visited.size && pickDestination(pool, S.tripOrigin, S.transport, S.timeRange, S.budget, 4)) { S.setupError = t("err_all_visited"); go("setup"); return; }
  if (!picked) { S.setupError = t("err_no_place_format", t(TRANSPORT[S.transport].key), t(TIME_KEY[S.timeRange])); go("setup"); return; }
  setProgress(1); await sleep(300);
  if (S.screen !== "loading") return;
  S.result = picked; go("reveal");
}

function viewReveal() {
  const r = S.result, c = catOf(r.category);
  return `<div class="screen">${topbar()}
  <div class="wrap"><div class="card rv" style="border-color:${c.hex}59">
   <div class="center">
    <span class="float" style="animation-duration:3s">${catIco(c, 68)}</span>
    <div style="margin-top:10px"><span class="tag" style="background:${c.hex}26;border:1px solid ${c.hex}66;color:${c.hex}">${t(c.key)}</span></div>
    <div class="clue">“${esc(r.clue)}”</div>
    <div class="mood">${esc(r.mood)}</div>
   </div>
   <div class="info2">
    <div class="ibox" style="background:rgba(var(--gold-rgb),.07);border:1px solid rgba(var(--gold-rgb),.2)"><div class="k">${t("reveal_est_time")}</div><div class="big">${r.travelTimeMin}<small>${t("unit_min")}</small></div></div>
    <div class="ibox" style="background:${glass(.04)};border:1px solid ${glass(.1)}"><div class="k">${t("reveal_transport")}</div><div style="color:var(--tm);display:flex;flex-direction:column;align-items:center;gap:4px">${icon(S.transport, 28)}<span style="font-size:11px">${t(TRANSPORT[S.transport].key)}</span></div></div>
   </div>
   ${S.budget != null ? `<div class="costrow"><span class="a">${t("reveal_est_cost")}</span><span class="b">${r.estimatedCost > 0 ? t("reveal_cost_about", fmtNum(r.estimatedCost)) : t("cost_free")}</span><span class="c">${t("reveal_cost_within", formatBudget(S.budget))}</span></div>` : ""}
   <div class="secret"><div class="k">${t("reveal_secret_hint")}</div><p>${esc(r.hint)}</p></div>
   <div class="guide"><span class="g">🌐</span><span>${esc(t("reveal_compass_guide"))}</span></div>
   <button class="btn-go plain" style="color:#14100C" data-act="depart">${t("reveal_depart")}</button>
   <button class="btn-ghost" style="margin-top:10px" data-act="to-setup">${t("reveal_another")}</button>
  </div></div></div>`;
}
function depart() {
  // 사용자 제스처 안에서 호출되어야 iOS 가 나침반 권한 창을 띄운다
  requestCompass(); unlockAudio();
  S.quests = pickThree(S.result && S.result.category); S.arrivalPhoto = null; S.historySaved = false; S.savingHistory = false; S.revealed = false;
  S.refl = { before: "", during: "", after: "", summary: "" }; S.lastZone = -1; S.heading = null;
  saveTrip(); startTracking(); go("navigate");
}
function resumeTrip() {
  const j = readTrip(); if (!j) return;
  requestCompass(); unlockAudio();
  S.result = j.result; S.transport = j.transport; S.tripOrigin = j.tripOrigin; S.budget = j.budget;
  S.quests = (j.quests || []).map((q) => ({ ...q, photo: null }));
  S.arrivalPhoto = null; S.historySaved = false; S.savingHistory = false; S.revealed = false;
  S.refl = { before: "", during: "", after: "", summary: "" }; S.lastZone = -1;
  startTracking(); go("navigate");
}

function compassSVG() {
  let ticks = "";
  for (let d = 0; d < 360; d += 15) {
    const major = d % 45 === 0;
    ticks += `<line x1="130" y1="${130 - (major ? 113 : 112)}" x2="130" y2="${130 - (major ? 103 : 106)}" stroke="#F0C419" stroke-opacity="${major ? 0.85 : 0.45}" stroke-width="${major ? 1.4 : 0.6}" transform="rotate(${d} 130 130)"/>`;
  }
  const card = (k, en, x, y) => `<text x="${x}" y="${y - 3}" text-anchor="middle" dominant-baseline="central" font-family="var(--serif)" font-weight="700" font-size="20" fill="#F0E7CD">${t(k)}</text><text x="${x}" y="${y + 13}" text-anchor="middle" font-size="9" font-weight="600" fill="#F0C419" fill-opacity=".8">${en}</text>`;

function fileToDataURL(file, maxSide, q) {
  return new Promise((res) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const sc = Math.min(1, maxSide / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", q));
    };
    img.onerror = () => { URL.revokeObjectURL(url); res(null); };
    img.src = url;
  });
}
let photoTarget = null;
function pickPhoto(target, source) { photoTarget = target; const el = $(source === "album" ? "in-album" : "in-cam"); el.value = ""; el.click(); }
async function onPhotoPicked(ev) {
  const f = ev.target.files && ev.target.files[0]; if (!f || !photoTarget) return;
  const target = photoTarget; photoTarget = null;
  if (target === "arrival") {
    const d = await fileToDataURL(f, 400, 0.65); if (!d) return toast(t("cam_fail"));
    S.arrivalPhoto = d; renderArrival();
  } else {
    const d = await fileToDataURL(f, 160, 0.6); if (!d) return toast(t("cam_fail"));
    const q = S.quests.find((x) => x.id === target); if (q) q.photo = d;
    const box = $("quests"); if (box) box.innerHTML = questsHTML(catOf(S.result.category).hex);
  }
}

let leafletP = null;
function loadLeaflet() {
  if (window.L && window.L.map) return Promise.resolve(window.L);
  if (leafletP) return leafletP;
  leafletP = new Promise((res, rej) => {
    const css = document.createElement("link"); css.rel = "stylesheet"; css.href = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"; document.head.appendChild(css);
    const s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js";
    s.onload = () => res(window.L); s.onerror = () => { leafletP = null; rej(new Error("leaflet")); }; document.head.appendChild(s);
  });
  return leafletP;
}
function tileLayer(LF) { return LF.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 18, attribution: "© OpenStreetMap" }); }
async function coordsOf(e) {
  if (e.destLat != null && e.destLng != null) return { lat: e.destLat, lng: e.destLng };
  const pool = await loadPool();
  const p = pool && pool.find((x) => x.name === e.placeName);
  return p ? { lat: p.lat, lng: p.lng } : null;
}
let histMap = null;
async function drawHistMap() {
  const box = $("hmap"); if (!box) return;
  try {
    const LF = await loadLeaflet();
    const pins = [];
    for (const e of HIST) { const c = await coordsOf(e); if (c) pins.push({ e, c }); }
    if (!$("hmap")) return;
    if (!pins.length) { $("hmap").outerHTML = `<div class="empty"><div class="a">${t("hist_no_map")}</div></div>`; return; }
    if (histMap) { histMap.remove(); histMap = null; }
    histMap = LF.map("hmap", { zoomControl: true, attributionControl: true });
    tileLayer(LF).addTo(histMap);
    const b = [];
    for (const { e, c } of pins) {
      const col = catOf(e.category).hex;
      LF.marker([c.lat, c.lng], { icon: LF.divIcon({ className: "", html: `<div class="pin" style="background:${col}"></div>`, iconSize: [24, 24], iconAnchor: [12, 12] }) })
        .addTo(histMap).bindPopup(esc(e.placeName)).on("click", () => {});
      b.push([c.lat, c.lng]);
    }
    histMap.fitBounds(b, { padding: [30, 30], maxZoom: 14 });
  } catch (err) { const el = $("hmap"); if (el) el.outerHTML = `<div class="empty"><div class="a">${t("map_unavailable")}</div></div>`; }
}

    const ang = (i / total) * Math.PI * 2 - Math.PI / 2, rr = i % 2 === 0 ? R : inner;
    d += (i ? "L" : "M") + (55 + Math.cos(ang) * rr).toFixed(2) + "," + (55 + Math.sin(ang) * rr).toFixed(2);
  }

   <circle cx="55" cy="55" r="46" fill="#14100C"/><circle cx="55" cy="55" r="42" fill="none" stroke="${a}" stroke-opacity=".31"/><circle cx="55" cy="55" r="38" fill="none" stroke="${a}" stroke-opacity=".31"/>

  m.innerHTML = `<div class="mwrap"><div class="mhead"><h3>${nagIco(28)}${t("consent_title")}</h3><button class="mdone" data-act="modal-close">${t("consent_cancel")}</button></div>
   <p class="sub" style="font-size:15px;line-height:1.7;margin:4px 4px 12px">${t("consent_sub")}</p>
   ${item("👟", "walk")}${item("📍", "gps")}${item("⚠️", "safe")}${item("🔋", "batt")}${item("🤝", "manner")}
   <button class="btn-go" style="margin:16px 0 8px" data-act="consent-agree">${t("consent_agree")}</button></div>`;
  m.classList.add("on"); m.scrollTop = 0;
}
function closeModal() { const m = $("modal"); m.classList.remove("on"); m.innerHTML = ""; if (detailMap) { detailMap.remove(); detailMap = null; } }
async function openDetail(id) {
  const e = HIST.find((x) => String(x.id) === String(id)); if (!e) return;
  const c = catOf(e.category), a = c.hex, m = $("modal");
  const dc = await coordsOf(e);
  m.innerHTML = `<div class="mwrap"><div class="mhead"><span></span><button class="mdone" data-act="modal-close">${t("settings_done")}</button></div>
   ${e.photo ? `<img class="dphoto" src="${e.photo}" alt="" style="border:1px solid ${a}59">` : `<div class="dph0" style="background:${a}14;border:1px solid ${a}40">${catIco(c, 84)}</div>`}
   <div class="dtitle"><div class="c" style="color:${a}">${catIco(c, 14)} ${t(c.key)}</div><h4>${esc(e.placeName)}</h4><div class="m">No.${String(e.visitCount).padStart(3, "0")}  ·  ${dateStr(e.date)}</div></div>
   <div class="dinfo"><div><div class="k">${t("compass_distance")}</div><div class="v">${formatDistance((e.distanceKm || 0) * 1000)}</div></div>
    <div><div class="k">${t("reveal_transport")}</div><div class="v">${t(TRANSPORT[e.transport]?.key || "transport_walk")}</div></div>
    <div><div class="k">${t("reveal_est_cost")}</div><div class="v">${e.estimatedCost > 0 ? formatBudget(e.estimatedCost) : t("cost_free")}</div></div></div>
   ${dc ? `<div class="dsec" style="border:1px solid ${a}29"><div class="k">${t("detail_route")}</div><div class="rmap" id="rmap"></div>
     <div class="legend"><span><i style="background:#2E9E5B"></i>${t("detail_origin")}</span><span><i style="background:#C8302E"></i>${t("detail_dest")}</span></div></div>` : ""}
   ${e.clue ? `<div class="dsec" style="border:1px solid ${a}29"><div class="k">${t("detail_clue")}</div><p style="font-style:italic">${esc(e.clue)}</p></div>` : ""}
   ${e.journal ? `<div class="dsec" style="border:1px solid ${a}29"><div class="k">${t("detail_journal")}</div><p class="j">${esc(e.journal.replace(/ \/ /g, "\n"))}</p></div>` : ""}
  </div>`;
  m.classList.add("on"); m.scrollTop = 0;
  if (dc) {
    try {
      const LF = await loadLeaflet(); if (!$("rmap")) return;
      detailMap = LF.map("rmap", { zoomControl: false, attributionControl: false }); tileLayer(LF).addTo(detailMap);
      const pts = [[dc.lat, dc.lng]];
      LF.marker([dc.lat, dc.lng], { icon: LF.divIcon({ className: "", html: `<div class="dotr"></div>`, iconSize: [16, 16], iconAnchor: [8, 8] }) }).addTo(detailMap);
      if (e.originLat != null) {
        pts.push([e.originLat, e.originLng]);
        LF.polyline([[e.originLat, e.originLng], [dc.lat, dc.lng]], { color: "#F0C419", weight: 3, dashArray: "6 5", opacity: 0.9 }).addTo(detailMap);
        LF.marker([e.originLat, e.originLng], { icon: LF.divIcon({ className: "", html: `<div class="dotg"></div>`, iconSize: [14, 14], iconAnchor: [7, 7] }) }).addTo(detailMap);
      }
      if (pts.length > 1) detailMap.fitBounds(pts, { padding: [24, 24] }); else detailMap.setView(pts[0], 15);
    } catch (err) { const el = $("rmap"); if (el) el.outerHTML = `<div class="empty"><div class="a" style="font-size:12px">${t("map_unavailable")}</div></div>`; }
  }
}
function openSettings() {
  const m = $("modal"), seg = (key, opts) => `<div class="seg">${opts.map(([v, lb]) => `<button class="${settings[key] === v ? "on" : ""}" data-act="set" data-k="${key}" data-v="${v}">${lb}</button>`).join("")}</div>`;
  m.innerHTML = `<div class="mwrap"><div class="mhead"><h3><span>⚙️</span>${t("settings_title")}</h3><button class="mdone" data-act="modal-close">${t("settings_done")}</button></div>
   <div class="scard"><div class="sh"><span>📱</span>${t("settings_sec_display")}</div><div class="k" style="font-size:16px">${t("settings_theme")}</div>
    ${seg("theme", [["system", t("settings_theme_system")], ["light", t("settings_theme_light")], ["dark", t("settings_theme_dark")]])}</div>
   <div class="scard"><div class="sh"><span>🗺️</span>${t("settings_sec_env")}</div>
    <div class="k" style="font-size:16px">${t("settings_distance_unit")}</div>${seg("unit", [["km", t("settings_unit_km")], ["mile", t("settings_unit_mile")]])}
    <div class="sdiv"></div>
    <div class="srow"><span class="k">${t("settings_language")}</span><select class="sel" data-bind="lang">${LANGS.map((l) => `<option value="${l.code}" ${lang === l.code ? "selected" : ""}>${l.flag} ${l.name}</option>`).join("")}</select></div>
    <div class="sdiv"></div>
    <div class="srow"><span class="k">${t("settings_region")}</span><select class="sel" data-bind="region">${["KR", "US", "JP", "CN", "ES"].map((r) => `<option value="${r}" ${settings.region === r ? "selected" : ""}>${t("region_" + r)}</option>`).join("")}</select></div></div>
   <div class="scard"><div class="sh"><span>🔔</span>${t("settings_sec_notify")}</div>
    <div class="srow"><div><div class="k">${t("prox_alert")}</div><div class="sub">${t("prox_alert_sub")}</div></div><button class="tog ${settings.prox ? "on" : ""}" data-act="toggle-prox" aria-label="toggle"></button></div></div>
   <div class="scard"><div class="sh"><span>ℹ️</span>${t("settings_sec_about")}</div>
    <div class="srow"><span class="k">${t("settings_version")}</span><span class="sub">web v4.2 (PWA)</span></div><div class="sdiv"></div>
    <div class="srow"><span class="k">${t("settings_made_by")}</span><span class="sub">${t("settings_company")}</span></div>
    ${S.session ? `<div class="sdiv"></div><button class="lbtn out" data-act="logout" style="margin-top:0">${t("settings_logout")}</button>` : ""}</div>
  </div>`;
  m.classList.add("on");
}

// ---------------------------------------------------------------
// 23. 라우터 · 이벤트
// ---------------------------------------------------------------
function render() {
  document.body.classList.toggle("loading", S.screen === "loading");
  const views = { intro: viewIntro, setup: viewSetup, loading: viewLoading, reveal: viewReveal, navigate: viewNavigate, history: viewHistory };
  const same = render._last === S.screen; render._last = S.screen;
  app.innerHTML = (views[S.screen] || viewIntro)();
  if (same) { const sc = app.querySelector(".screen"); if (sc) sc.style.animation = "none"; const cd = app.querySelector(".card"); if (cd) cd.style.animation = "none"; }
  if (S.screen === "loading") startLoadMsgs();
  if (S.screen === "navigate") { S.needleRot = S.needleRot || 0; updateNav(); }
  if (S.screen === "history" && S.histTab === "map") drawHistMap();
}
function go(scr) { S.screen = scr; render(); window.scrollTo(0, 0); }
function rerenderAll() {
  document.documentElement.lang = lang;
  render();
  if ($("modal").classList.contains("on") && $("modal").querySelector(".seg")) openSettings();
  renderArrival();
}

const ACT = {
  "to-setup": () => { if (!hasConsent()) { openConsent(); return; } S.setupError = ""; go("setup"); },
  "consent-agree": () => { try { localStorage.setItem("dobalro_consent_v1", String(Date.now())); } catch (e) {} closeModal(); S.setupError = ""; go("setup"); },
  "to-intro": () => go("intro"),
  "to-history": () => { go("history"); mergeRemoteHistory().then(() => { if (S.screen === "history") render(); }); },
  "settings": () => openSettings(),
  "modal-close": () => closeModal(),
  "gps": () => handleGps(),
  "time": (el) => { S.timeRange = el.dataset.v; render(); },
  "transport": (el) => { S.transport = el.dataset.v; render(); },
  "group": (el) => { S.groupSize = +el.dataset.v; render(); },
  "start-draw": () => handleStart(),
  "depart": () => depart(),
  "resume": () => resumeTrip(),
  "resume-drop": () => { S.resumeDismissed = true; clearTrip(); render(); },
  "nav-back": () => { stopTracking(); go("reveal"); },
  "nav-arrived": () => { S.revealed = true; renderArrival(); },
  "map-pick": () => openMapSheet(),
  "quest-cam": (el) => pickPhoto(el.dataset.id, "cam"),
  "arr-photo": () => sheet({ title: t("nav_arrival_photo"), buttons: [
    { label: t("nav_take_photo"), onClick: () => { closeSheet(); pickPhoto("arrival", "cam"); } },
    { label: t("nav_pick_album"), onClick: () => { closeSheet(); pickPhoto("arrival", "album"); } },
    { label: t("common_cancel"), role: "cancel", onClick: closeSheet } ] }),
  "arr-record": () => recordHistory(),
  "arr-not-yet": () => { S.revealed = false; renderArrival(); },
  "arr-history": () => { stopTracking(); S.revealed = false; renderArrival(); S.histTab = "summary"; go("history"); },
  "arr-new": () => resetTrip(),
  "htab": (el) => { S.histTab = el.dataset.v; render(); },
  "scat": (el) => { S.stampCat = el.dataset.v || null; render(); },
  "detail": (el, ev) => { if (ev.target.closest('[data-act="del-one"]')) return; openDetail(el.dataset.id); },
  "del-one": (el, ev) => { ev.stopPropagation(); confirmDelete(el.dataset.id); },
  "del-all": () => confirmDeleteAll(),
  "sheet": (el) => { const f = sheet._h && sheet._h[+el.dataset.i]; if (f) f(); },
  "set": (el) => { settings[el.dataset.k] = el.dataset.v; saveSettings(); if (el.dataset.k === "theme") applyTheme(); openSettings(); render(); },
  "toggle-prox": () => { settings.prox = !settings.prox; saveSettings(); if (settings.prox) unlockAudio(); openSettings(); },
  "login": async (el) => {
    if (!supabase) return toast("Supabase");
    await supabase.auth.signInWithOAuth({ provider: el.dataset.p, options: { redirectTo: window.location.href } });
  },
  "pw-signin": () => pwAuth(false),
  "pw-signup": () => pwAuth(true),
  "logout": async () => { if (supabase) await supabase.auth.signOut(); S.session = null; closeModal(); render(); },
  "install": async () => {
    if (!S.deferredInstall) return toast(t("install_android_p"));
    S.deferredInstall.prompt(); await S.deferredInstall.userChoice; S.deferredInstall = null; render();
  },
};

// ---- Supabase 이메일/비밀번호 로그인 (테스트용) ----
async function pwAuth(signup) {
  const msg = (k, ok) => { const m = $("lgMsg"); if (m) { m.textContent = k ? t(k) : ""; m.className = "lmsg" + (ok ? " ok" : ""); } };
  if (!supabase) return msg("login_fail");
  const email = ($("lgEmail") || {}).value ? $("lgEmail").value.trim() : "";
  const pw = ($("lgPw") || {}).value || "";
  if (!email || pw.length < 6) return msg("login_need");
  msg("login_wait", true);
  try {
    if (signup) {
      const { data, error } = await supabase.auth.signUp({ email, password: pw });
      if (error) {
        const m = (error.message || "").toLowerCase();
        return msg(m.includes("already") ? "login_exists" : "login_fail");
      }
      if (data && data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) return msg("login_exists");
      if (data && data.session) { S.session = data.session; toast(t("login_ok")); render(); return; }
      return msg("login_confirm_sent", true);
    }
    const { data, error } = await supabase.auth.signInWithPassword({ email, password: pw });
    if (error) {
      const m = (error.message || "").toLowerCase();
      return msg(m.includes("confirm") ? "login_unconfirmed" : m.includes("invalid") ? "login_bad" : "login_fail");
    }
    S.session = data.session; toast(t("login_ok")); render();
  } catch (e) { msg("login_fail"); }
}
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const fn = ACT[el.dataset.act]; if (fn) fn(el, e);
});
document.addEventListener("input", (e) => {
  const el = e.target, b = el.dataset && el.dataset.bind; if (!b) return;
  if (b === "loc") { S.locationText = el.value; if (S.gps) { S.gps = null; S.weather = S.weather; refreshGps(); } }
  else if (b === "budget") {
    const d = el.value.replace(/\D/g, "").slice(0, 9);
    S.budgetText = d ? fmtNum(parseInt(d, 10)) : ""; el.value = S.budgetText;
    el.classList.toggle("hl", !!d); const n = $("bnote"); if (n) n.innerHTML = budgetNote();
  } else if (b.startsWith("refl-")) S.refl[b.slice(5)] = el.value;
});
document.addEventListener("change", (e) => {
  const el = e.target, b = el.dataset && el.dataset.bind; if (!b) return;
  if (b === "lang") { lang = el.value; settings.lang = lang; saveSettings(); rerenderAll(); }
  else if (b === "region") { settings.region = el.value; saveSettings(); render(); }
});
window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); S.deferredInstall = e; if (S.screen === "intro") render(); });
window.addEventListener("appinstalled", () => { S.deferredInstall = null; toast(t("install_done")); if (S.screen === "intro") render(); });

// ---------------------------------------------------------------
// 24. 시작
// ---------------------------------------------------------------
async function boot() {
  render();
  loadPool();                       // 미리 불러두기 (places.json)
  await initSupabase();
  if (supabase) {
    try {
      const { data } = await supabase.auth.getSession(); S.session = data.session;
      supabase.auth.onAuthStateChange((_ev, session) => { S.session = session; if (S.screen === "intro") render(); });
      if (S.screen === "intro") render();
    } catch (e) {}
  }
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(() => {});
}
boot();
</script>
